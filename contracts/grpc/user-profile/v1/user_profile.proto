syntax = "proto3";

package falumni.userprofile.v1;

option csharp_namespace = "Contracts.Grpc.UserProfile.V1";

// Service contract for internal service-to-service user profile lookups.
// Primary Owner: User Service (Backend Dev 1).
// Consumer: Chat Service (Backend Dev 3) and other internal backend services.
service UserProfileService {
  // Retrieves the public summary profile for a single user by their unique ID.
  rpc GetUserSummary (GetUserSummaryRequest) returns (GetUserSummaryResponse);
}

// Request payload for GetUserSummary.
message GetUserSummaryRequest {
  // Unique identifier of the user (UUID string format, e.g. "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d").
  string user_id = 1;
}

// Response payload containing public profile summary data.
message GetUserSummaryResponse {
  // Unique identifier of the user.
  string user_id = 1;

  // Public display name (e.g. "Nguyen Van A").
  string display_name = 2;

  // URL pointing to the user's avatar image.
  string avatar_url = 3;

  // Basic public status of the user account: "Active", "Alumni", "Student", or "Suspended".
  string status = 4;
}
