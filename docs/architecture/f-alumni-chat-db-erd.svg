<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%" font-family="Courier New, monospace">
  <rect width="1100" height="660" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="550" y="38" fill="#000000" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ERD: FAlumni_Chat_Db (Chat Service — Zero Cross-DB FK)</text>

  <!-- Table 1: Conversations -->
  <rect x="60" y="200" width="400" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="60" y1="230" x2="460" y2="230" stroke="#000000" stroke-width="1.5"/>
  <text x="260" y="220" fill="#000000" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Conversations</text>
  <text x="72" y="252" fill="#000000" font-size="12">+ PK  Id : uniqueidentifier NOT NULL</text>
  <text x="72" y="272" fill="#000000" font-size="12">+     Title : nvarchar(200) NOT NULL</text>
  <text x="72" y="292" fill="#000000" font-size="12">+     IsGroup : bit NOT NULL</text>
  <text x="72" y="312" fill="#000000" font-size="12">+     CreatedByUserId : uniqueidentifier NOT NULL</text>
  <text x="72" y="332" fill="#000000" font-size="12">+     CreatedAtUtc : datetime2 NOT NULL</text>
  <text x="72" y="352" fill="#000000" font-size="12">+     LastMessageAtUtc : datetime2 NOT NULL</text>

  <!-- Table 2: ConversationParticipants -->
  <rect x="600" y="80" width="440" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="600" y1="110" x2="1040" y2="110" stroke="#000000" stroke-width="1.5"/>
  <text x="820" y="100" fill="#000000" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ConversationParticipants</text>
  <text x="612" y="132" fill="#000000" font-size="12">+ PK     Id : uniqueidentifier NOT NULL</text>
  <text x="612" y="152" fill="#000000" font-size="12">+ FK,UK  ConversationId : uniqueidentifier NOT NULL</text>
  <text x="612" y="172" fill="#000000" font-size="12">+ UK     UserId : uniqueidentifier NOT NULL (Scalar)</text>
  <text x="612" y="192" fill="#000000" font-size="12">+        DisplayName : nvarchar(max) NOT NULL</text>
  <text x="612" y="212" fill="#000000" font-size="12">+        AvatarUrl : nvarchar(max) NOT NULL</text>
  <text x="612" y="232" fill="#000000" font-size="12">+        IsMuted : bit NOT NULL</text>
  <text x="612" y="252" fill="#000000" font-size="12">+        IsHidden : bit NOT NULL</text>
  <text x="612" y="272" fill="#000000" font-size="12">+        JoinedAtUtc : datetime2 NOT NULL</text>
  <text x="612" y="292" fill="#000000" font-size="12">+        LastReadAtUtc : datetime2 NULL</text>

  <!-- Table 3: Messages -->
  <rect x="600" y="370" width="440" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <line x1="600" y1="400" x2="1040" y2="400" stroke="#000000" stroke-width="1.5"/>
  <text x="820" y="390" fill="#000000" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Messages (ChatMessage)</text>
  <text x="612" y="422" fill="#000000" font-size="12">+ PK  Id : uniqueidentifier NOT NULL</text>
  <text x="612" y="442" fill="#000000" font-size="12">+ FK  ConversationId : uniqueidentifier NOT NULL</text>
  <text x="612" y="462" fill="#000000" font-size="12">+     SenderId : uniqueidentifier NOT NULL (Scalar)</text>
  <text x="612" y="482" fill="#000000" font-size="12">+     Content : nvarchar(4000) NOT NULL</text>
  <text x="612" y="502" fill="#000000" font-size="12">+     AttachmentUrl : nvarchar(500) NULL</text>
  <text x="612" y="522" fill="#000000" font-size="12">+     AttachmentType : nvarchar(100) NULL</text>
  <text x="612" y="542" fill="#000000" font-size="12">+     Status : nvarchar(30) NOT NULL</text>
  <text x="612" y="562" fill="#000000" font-size="12">+     CreatedAtUtc : datetime2 NOT NULL</text>
  <text x="612" y="582" fill="#000000" font-size="12">+     ReadAtUtc : datetime2 NULL</text>

  <!-- Black Relationships with Crow's Foot -->
  <!-- Conversations (1) -> (N) ConversationParticipants -->
  <polyline points="460,255 530,255 530,195 600,195" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="472" y1="248" x2="472" y2="262" stroke="#000000" stroke-width="1.5"/>
  <line x1="586" y1="195" x2="600" y2="187" stroke="#000000" stroke-width="1.5"/>
  <line x1="586" y1="195" x2="600" y2="203" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="187" fill="#000000" font-family="Arial, sans-serif" font-size="11">1 : N</text>

  <!-- Conversations (1) -> (N) Messages -->
  <polyline points="460,315 530,315 530,485 600,485" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="472" y1="308" x2="472" y2="322" stroke="#000000" stroke-width="1.5"/>
  <line x1="586" y1="485" x2="600" y2="477" stroke="#000000" stroke-width="1.5"/>
  <line x1="586" y1="485" x2="600" y2="493" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="477" fill="#000000" font-family="Arial, sans-serif" font-size="11">1 : N</text>
</svg>
